<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>DUEL</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:manipulation}
#menu,#game{height:100%;max-width:520px;margin:0 auto;flex-direction:column;position:relative}
#menu{display:flex;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}

body.tense #game{box-shadow:inset 0 0 calc(30px + var(--t)*22px) rgba(255,0,40,calc(.1 + var(--t)*.07));animation:beat calc(1.5s - var(--t)*.17s) infinite}
@keyframes beat{50%{filter:brightness(.82)}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body>
<div id="menu">
<h1>DUEL</h1><div class="sm">동시 심리전 · 체력 1 · 한 발이면 끝</div>
<button class="big" id="bLocal">👥 1대1 로컬 대전</button>
<button class="big" id="bRobot">🤖 로봇 대전</button><button class="big" id="bOnline">🌐 온라인 대전</button><div class="row" id="olp" style="display:none"><button id="bCreate">방 만들기</button><input id="rc" maxlength="5" placeholder="방 코드" style="flex:1;min-width:0;text-transform:uppercase;text-align:center;font-size:18px;border-radius:12px;border:2px solid #2c3546;background:#181e29;color:#e8ecf3"><button id="bJoin">참가</button></div><button id="bRejoin" style="display:none">↩ 마지막 방 재접속</button>

<div class="sm">로컬: 한 화면에서 위쪽(P2)·아래쪽(P1)이 동시에 선택해요. 선택 내용은 공개되지 않아요.<br>온라인 대전은 Supabase 설정(README.md) 후 직접 호스팅한 페이지에서만 동작합니다.</div>
</div>
<div id="game">
<div id="top"><span id="modeT"></span><span id="turnT"></span><span id="remT"></span>
<span><button class="tgl" data-k="sfx">🔊</button> <button class="tgl" data-k="bgm">🎵</button> <button class="tgl" data-k="tense">🔥</button> <button class="tgl" id="bMenu">✕</button></span></div>

<div id="ov"></div>
</div>
<script>
const $=s=>document.querySelector(s),RES=1300,MAXT=15,COL=['#4cc9f0','#ff9f43'];
const A={shoot:'쏘기',block:'막기',reload:'장전',pass:'턴 넘김'},IC={shoot:'🔫',block:'🛡️',reload:'🔄'};
let G={phase:'none',rc:0},TM=[],cfg={sfx:1,bgm:1,tense:1};
const later=(f,ms)=>TM.push(setTimeout(f,ms));
const vib=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
/* ===== Audio: 모든 효과음은 Aud.play()를 거친다 ===== */
const Aud=(()=>{let c,sg,mg,mt=null,st=0;
function init(){if(c){c.resume&&c.resume();return}try{c=new(window.AudioContext||window.webkitAudioContext)();sg=c.createGain();sg.gain.value=.7;sg.connect(c.destination);mg=c.createGain();mg.gain.value=.22;mg.connect(c.destination)}catch(e){c=null}}
function tone(f,d,ty,v,f2,t0,dst){if(!c)return;const t=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dst||sg);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fr,t0){if(!c)return;const n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fr;g.gain.value=v;s.connect(f);f.connect(g);g.connect(sg);s.start(c.currentTime+(t0||0))}
const FX={shoot(){noise(.2,.7,6000);tone(240,.22,'sawtooth',.4,40)},block(){tone(90,.28,'triangle',.8,45);noise(.08,.3,500)},reload(){tone(1800,.04,'square',.12);tone(900,.06,'square',.14,0,.13);tone(1400,.05,'square',.16,0,.3)},
death(){tone(150,.7,'sawtooth',.6,30);noise(.5,.6,900)},wind(){noise(1.6,.12,600)},duel(){noise(.3,.8,3000);tone(110,.5,'sawtooth',.6,35)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.3,0,i*.14))},lose(){[330,262,196,147].forEach((f,i)=>tone(f,.4,'triangle',.3,0,i*.18))}};
function play(n){if(!c||!cfg.sfx||!FX[n])return;if(G.playing&&G.rc>0&&n!=='death')return;FX[n]()}
const NB=[110,110,131,98,110,110,147,131],AR=[440,523,659,523,587,523,440,392];
function tick(m){st++;if(m==='normal'){tone(NB[st%8],.22,'square',.14,0,0,mg);if(st%2)tone(AR[st%8],.15,'triangle',.12,0,0,mg);if(st%4==0)noise(.05,.15,3000)}
else{if(st%4==0)tone(62,.2,'sine',1,36,0,mg);if(st%4==1)tone(55,.15,'sine',.7,34,0,mg);tone(st%16<8?55:58,.25,'sawtooth',.08,0,0,mg);if(st%8==5)tone(st%16<8?880:1244,.3,'sine',.05,0,0,mg)}}
function stop(){if(mt){clearInterval(mt);mt=null}}
function refresh(){stop();if(mg)mg.gain.value=.22;if(!c||!G.playing)return;const m=G.rc>0?'tense':'normal';if(m==='normal'&&!cfg.bgm)return;if(m==='tense'&&!cfg.tense)return;st=0;mt=setInterval(()=>tick(m),m==='normal'?240:Math.max(105,200-G.rc*18))}
return{init,play,stopM:stop,refresh,duck:v=>{if(mg)mg.gain.value=v}}})();
/* ===== 게임 로직 ===== */
const nameOf=i=>G.mode==='local'?'P'+(i+1):i?(G.mode==='online'?'상대방':'로봇'):'나';
const valid=i=>{const P=G.pl[i],r=[];if(P.ammo>0)r.push('shoot');if(!P.prevBlock)r.push('block');if(P.ammo<2)r.push('reload');r.push('pass');return r};
const limitFor=()=>{let L=Math.round((3-0.2*(G.rc+1)*(G.turn-1))*10)/10;return L<=0?.1:L};
function setTension(){document.body.style.setProperty('--t',Math.min(G.rc,6));document.body.classList.toggle('tense',G.rc>0&&G.playing)}
function clearAll(){TM.forEach(clearTimeout);TM=[];if(sbCh&&sb){sb.removeChannel(sbCh);sbCh=null}if(G.loop)cancelAnimationFrame(G.loop);Aud.stopM();document.body.classList.remove('tense');$('#ov').style.display='none';G={phase:'none',rc:0,playing:false};vib(0)}
function newGame(mode,diff){Aud.init();clearAll();G={mode,diff,rc:0,playing:true,peek:[0,0],phase:'none',f:{shoot:0,block:0,other:0}};
$('#menu').style.display='none';$('#game').style.display='flex';
$('#modeT').textContent=mode==='local'?'1대1 대전':'로봇·'+{easy:'쉬움',normal:'보통',hard:'어려움'}[diff];
$('#p2').classList.toggle('rot',mode==='local');$('#p2').classList.toggle('nobt',mode!=='local');
[0,1].forEach(mk);resetRound();Aud.refresh();G.loop=requestAnimationFrame(loop);startIntro()}
function mk(i){const el=$('#p'+(i+1));el.innerHTML='<div class="inf"><b class="nm"></b><span class="hp"></span><span class="am"></span></div><div class="bt">'+['shoot','block','reload'].map(a=>`<button data-a="${a}">${IC[a]} ${A[a]}</button>`).join('')+'</div><div class="st"></div>';
el.querySelectorAll('.bt button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();choose(i,b.dataset.a)}));
const am=el.querySelector('.am');am.onpointerdown=e=>{G.peek[i]=1;ui()};['pointerup','pointerleave','pointercancel'].forEach(ev=>am.addEventListener(ev,()=>{G.peek[i]=0;ui()}))}
function resetRound(){G.pl=[0,1].map(()=>({hp:1,ammo:0,prevBlock:false,act:null,locked:false}));G.turn=0;G.anim=null;G.ai={oMin:0,oMax:0,oBlock:false,oKnown:true};setTension()}
function startTurn(){if(!G.playing)return;G.turn++;G.phase='select';G.limit=limitFor();G.t0=performance.now();G.pl.forEach(p=>{p.act=null;p.locked=false});$('#msg').textContent='';ui()}
function choose(i,a){if(G.phase!=='select')return;if(G.mode==='robot'&&i!==0)return;const P=G.pl[i];if(P.locked||!valid(i).includes(a))return;P.act=a;P.locked=true;ui();if(G.mode==='online'){submitMove(a);return}if(G.mode==='robot'||(G.pl[0].locked&&G.pl[1].locked))resolveTurn()}
function wpick(w){let s=0;for(const k in w)s+=w[k];let r=Math.random()*s;for(const k in w){r-=w[k];if(r<=0)return k}return'pass'}
function aiPick(){const P=G.pl[1],ai=G.ai,d=G.diff,w={shoot:0,block:0,reload:0,pass:0};valid(1).forEach(a=>w[a]=1);
const oShoot=ai.oMax>0,oBlock=!(ai.oKnown&&ai.oBlock);
if(d==='easy'){w.shoot*=1.3;w.pass*=.8;return wpick(w)}
if(w.shoot){if(!oBlock&&!oShoot)return'shoot';if(!oBlock)w.shoot*=3;else w.shoot*=.8;if(oShoot)w.shoot*=1.4}
w.block*=oShoot?(ai.oMin>0?3.4:2.2):.15;
if(P.ammo<2)w.reload*=oShoot?1:(P.ammo?2:3.5);
w.pass*=.3;
if(d==='hard'){const f=G.f,n=f.shoot+f.block+f.other+3,pS=(f.shoot+1)/n,pB=(f.block+1)/n;w.block*=.6+pS*3;w.shoot*=.8+(1-pB)*.8;w.reload*=.8+pB*.6;if(Math.random()<.08)w.pass*=6}
return wpick(w)}
function resolveTurn(){if(G.phase!=='select')return;if(G.mode==='online'){G.phase='wait';later(sbTick,300);return}G.phase='resolve';const P=G.pl,rm=G.rc>0;
const acts=[0,1].map(i=>{let a=P[i].locked?P[i].act:(G.mode==='robot'&&i===1?aiPick():'pass');return valid(i).includes(a)?a:'pass'});
const[a,b]=acts,hit=[b==='shoot'&&a!=='block',a==='shoot'&&b!=='block'],blocked=[a==='shoot'&&b==='block',b==='shoot'&&a==='block'];
const ai=G.ai;G.f[a==='shoot'?'shoot':(!rm&&a==='block')?'block':'other']++;
if(a==='shoot'){ai.oMin=Math.max(0,ai.oMin-1);ai.oMax=Math.max(0,ai.oMax-1)}else if(!rm){if(a==='reload'){ai.oMin=Math.min(2,ai.oMin+1);ai.oMax=Math.min(2,ai.oMax+1)}}else ai.oMax=Math.min(2,ai.oMax+1);
ai.oBlock=!rm&&a==='block';ai.oKnown=!rm||a==='shoot';
acts.forEach((x,i)=>{const p=P[i];p.pa=p.ammo;if(x==='shoot')p.ammo--;if(x==='reload')p.ammo=Math.min(2,p.ammo+1);p.prevBlock=x==='block';if(hit[i])p.hp=0});
G.anim={t0:performance.now(),acts,hit,blocked,hidden:rm};$('#tn').textContent='▶';ui();
later(()=>{acts.forEach(x=>{if(x==='block'||x==='reload')Aud.play(x)})},.25*RES);
later(()=>{if(acts.includes('shoot'))Aud.play('shoot');if(acts.includes('shoot'))vib(25)},.4*RES);
later(()=>{const parts=[];acts.forEach((x,i)=>{if(!rm)parts.push(nameOf(i)+': '+A[x]);else if(x==='shoot')parts.push(nameOf(i)+' 쏘기!');else if(!(G.mode==='robot'&&i===0))parts.push(G.mode==='robot'?'상대방이 턴을 넘겼습니다':nameOf(i)+'이(가) 턴을 넘겼습니다')});$('#msg').textContent=parts.join('  ·  ')},.35*RES);
later(()=>{if(hit[0]||hit[1]){Aud.play('death');vib([80,40,160])}},.7*RES);
later(()=>{if(G.anim){G.anim.done=true;ui()}},.55*RES);if(hit[0]&&hit[1])later(()=>{$('#msg').textContent='무승부'},1.2*RES);later(afterTurn,(hit[0]&&hit[1]?2:1.4)*RES)}
function afterTurn(){if(!G.playing)return;const d0=G.pl[0].hp<=0,d1=G.pl[1].hp<=0;
if(d0&&d1)rematch('양쪽 동시 사망');else if(d0||d1)finish(d0?1:0);else if(G.turn>=MAXT)rematch(MAXT+'턴 초과');else{G.phase='wait';later(startTurn,200)}}
function showOv(h){const o=$('#ov');o.innerHTML=h;o.style.display='flex'}
function rematch(why){G.phase='draw';if(G.rc>=4)return coinToss();G.rc++;setTension();Aud.refresh();
showOv(`<div class="t">무승부 — 재대결</div><div>${why}</div><div class="sm">재대결 ${G.rc}/4회차 · 턴마다 ${(0.2*(G.rc+1)).toFixed(1)}초씩 감소<br>상대의 장전·방어는 보이지 않습니다</div>`);
later(()=>{$('#ov').style.display='none';resetRound();startTurn()},2700)}
function finish(w,coin){G.phase='end';const n=G.rc;G.playing=false;G.rc=0;G.peek=[0,0];Aud.refresh();document.body.classList.remove('tense');
later(()=>{const t=G.mode==='local'?`P${w+1} 승리`:w===0?'승리':'패배';Aud.play(G.mode==='local'||w===0?'win':'lose');
showOv(`<div class="t" style="color:${COL[w]}">${t}</div><div class="sm">${coin?'동전 던지기로 승부가 결정됐습니다':n?`재대결 ${n}회 끝에 승부가 났습니다`:'한 발로 승부가 났습니다'}</div><button class="big" id="bAgain">다시 하기</button><button class="big" id="bBack">메인 메뉴</button>`);
const m=G.mode,d=G.diff;$('#bAgain').onclick=()=>m==='online'?toMenu():newGame(m,d);$('#bBack').onclick=toMenu},900)}
function toMenu(){clearAll();$('#game').style.display='none';$('#menu').style.display='flex'}
function ui(){const rm=G.rc>0;$('#turnT').textContent=`턴 ${G.turn}/${MAXT}`;$('#remT').textContent=`재대결 ${G.rc}`;
for(let i=0;i<2;i++){const P=G.pl[i],el=$('#p'+(i+1)),hide=rm&&(G.mode==='local'?!G.peek[i]:i===1),vs=valid(i),loc=G.mode==='local'&&rm,n=el.querySelector('.nm');
n.textContent=nameOf(i);n.style.color=COL[i];el.querySelector('.hp').textContent=P.hp>0?'♥':'✖';
el.querySelector('.am').textContent=hide?'탄약 ?':'탄약 '+'●'.repeat(sa(P))+'○'.repeat(2-sa(P));
el.querySelectorAll('.bt button').forEach(b=>b.classList.toggle('off',P.locked||G.phase!=='select'||(!loc&&!vs.includes(b.dataset.a))));
el.querySelector('.st').textContent=G.phase==='select'?(P.locked?'✔ 선택 완료':(i===1&&G.mode!=='local'?'생각 중…':'선택하세요')):''}}
/* ===== 렌더링 ===== */
const cx=$('#cv').getContext('2d');
function ln(c,a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
function figOld(c,x,dir,col,o){c.save();c.translate(x,165);c.scale(dir,1);if(o.dead)c.rotate(-o.dead*1.45);c.strokeStyle=c.fillStyle=col;c.lineWidth=6;c.lineCap='round';
const k=o.pose==='block'?o.p:0,hy=-42+k*8,sy=-82+k*24;ln(c,0,hy,-9,0);ln(c,0,hy,11,0);ln(c,0,hy,0,sy);c.beginPath();c.arc(k*6,sy-14,11,0,7);c.fill();
if(o.pose==='aim'){const ex=14+o.p*22-o.rec*8;ln(c,0,sy+2,ex,sy+4);c.fillStyle='#ddd';c.fillRect(ex-2,sy-1,16,7)}
else if(o.pose==='block'){ln(c,0,sy+2,18,sy-8);ln(c,0,sy+6,14,sy-16);c.strokeStyle='rgba(120,210,255,'+.8*o.p+')';c.lineWidth=5;c.beginPath();c.arc(30,sy+10,34,-1.2,1.2);c.stroke()}
else{ln(c,0,sy+2,12,sy+24);c.fillStyle='#ddd';c.fillRect(8,sy+22,14,6);if(o.pose==='reload'){c.fillStyle='#fc4';c.fillRect(12,sy+28+Math.sin(o.p*6.28)*10,6,12)}}
c.restore()}
function loop(now){G.loop=requestAnimationFrame(loop);now=now||performance.now();
if(G.phase==='select'){const rem=G.limit-(now-G.t0)/1000;$('#tn').textContent=Math.max(0,rem).toFixed(1);const r=Math.max(0,rem/G.limit);const bi=$('#bi');bi.style.width=r*100+'%';bi.style.background=r<.3?'var(--bad)':'var(--c1)';if(rem<=0)resolveTurn()}
draw(now)}
function drawOld(now){const c=cx,an=G.anim;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,360,200);let t=-1;if(G.phase==='resolve'&&an)t=Math.min(1,(now-an.t0)/RES);
let sh=0;if(t>.4&&t<.6&&an.acts.includes('shoot'))sh=5*(.6-t)/.2;if(t>.7&&t<.9&&an.hit.some(x=>x))sh=Math.max(sh,8*(.9-t)/.2);
c.save();c.translate((Math.random()-.5)*sh*2,(Math.random()-.5)*sh*2);

 $('#menu').style.display='none';$('#game').style.display='flex';$('#modeT').textContent='온라인 '+code;$('#p2').classList.remove('rot');$('#p2').classList.add('nobt');[0,1].forEach(mk);resetRound();G.loop=requestAnimationFrame(loop);
 showOv('<div class="sm">방 코드</div><div style="font-size:46px;letter-spacing:8px;font-weight:900">'+code+'</div><div class="sm">상대가 코드를 입력하면 시작합니다</div><button id="bLeave">나가기</button>');$('#bLeave').onclick=toMenu;
 sbCh=sb.channel('room:'+code,{config:{presence:{key:myId}}})
 .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'code=eq.'+code},p=>onRoom(p.new))
 .on('presence',{event:'sync'},onPresence)
 .subscribe(st=>{if(st==='SUBSCRIBED'){sbCh.track({t:Date.now()});syncState()}})}
async function syncState(){if(G.mode!=='online')return;const x=await sb.rpc('get_state',{c:G.code});if(x.error||G.mode!=='online')return;off=Date.parse(x.data.now)-Date.now();onRoom(x.data.room)}
function onPresence(){if(!G.started||!sbCh)return;const n=Object.keys(sbCh.presenceState()).length;if(n<2){G.opDown=1;$('#msg').textContent='⚠ 상대 연결이 끊겼습니다. 재접속을 기다립니다…'}else if(G.opDown){G.opDown=0;$('#msg').textContent='상대가 다시 연결되었습니다'}}
function onRoom(r){if(!r||G.mode!=='online'||!G.playing&&G.phase!=='end'&&G.phase!=='coin')return;G.seat=r.p1===myId?0:1;if(r.status==='waiting')return;
 if(!G.started){G.started=true;$('#ov').style.display='none';G.seq=r.seq;G.rc=r.rc;setTension();
  if(r.status==='finished')return finish(r.winner===G.seat?0:1);
  const d=srvMs(r.turn_start);if(r.seq===0&&d>1500){startIntro()}else{resetRound();G.phase='wait'}
  later(()=>beginTurn(r),Math.max(0,d));return}
 if(r.seq===G.seq+1&&r.last){G.seq=r.seq;onlinePlay(r)}
 else if(r.seq>G.seq+1){TM.forEach(clearTimeout);TM=[];G.started=false;onRoom(r)}}
async function beginTurn(r){if(G.mode!=='online'||!G.playing)return;const x=await sb.rpc('get_state',{c:G.code});if(x.error||G.mode!=='online'||!G.playing)return;const s=x.data,rr=s.room;off=Date.parse(s.now)-Date.now();
 const p=G.pl;p[0].ammo=s.ammo;p[0].prevBlock=s.pb;if(s.opp_ammo!=null)p[1].ammo=s.opp_ammo;G.rc=rr.rc;G.turn=rr.turn-1;$('#tm').style.display='';startTurn();G.limit=rr.limit_ms/1000;G.t0=performance.now()-(Date.now()+off-Date.parse(rr.turn_start));ui()}
async function submitMove(a){const r=await sb.rpc('submit_move',{c:G.code,a});if(r.error&&G.phase==='select'){G.pl[0].locked=false;G.pl[0].act=null;ui();$('#msg').textContent='전송 실패: '+r.error.message}}
async function sbTick(){if(G.mode!=='online')return;await sb.rpc('tick',{c:G.code});later(()=>{if(G.phase==='wait'){syncState();sbTick()}},2500)}
function onlinePlay(r){const me=G.seat,o=1-me,L=r.last,P=G.pl,rm=L.hidden,acts=[L.shown[me],L.shown[o]],hit=[L.hit[me],L.hit[o]],blocked=[L.blocked[me],L.blocked[o]],dbl=hit[0]&&hit[1];
 G.phase='resolve';P.forEach(p=>p.pa=p.ammo);if(!rm){const x=acts[1];P[1].ammo=Math.max(0,Math.min(2,P[1].ammo+(x==='shoot'?-1:x==='reload'?1:0)))}
 P.forEach((p,i)=>{if(hit[i])p.hp=0;p.locked=false});G.anim={t0:performance.now(),acts,hit,blocked,hidden:rm};$('#tn').textContent='▶';ui();
 sb.rpc('get_state',{c:G.code}).then(x=>{if(x.error||G.mode!=='online')return;P[0].ammo=x.data.ammo;P[0].prevBlock=x.data.pb;ui()});
 later(()=>{acts.forEach(x=>{if(x==='block'||x==='reload')Aud.play(x)})},.25*RES);
 later(()=>{if(acts.includes('shoot')){Aud.play('shoot');vib(25)}},.4*RES);
 later(()=>{const q=[];acts.forEach((x,i)=>{if(!rm)q.push(nameOf(i)+': '+A[x]);else if(x==='shoot')q.push(nameOf(i)+' 쏘기!');else if(i===1)q.push('상대방이 턴을 넘겼습니다')});$('#msg').textContent=q.join('  ·  ')},.35*RES);
 later(()=>{if(G.anim){G.anim.done=true;ui()}},.55*RES);
 later(()=>{if(hit[0]||hit[1]){Aud.play('death');vib([80,40,160])}},.7*RES);
 if(dbl)later(()=>{$('#msg').textContent='무승부'},1.2*RES);
 later(()=>onlineAfter(r,dbl),(dbl?2:1.4)*RES)}
function onlineAfter(r,dbl){if(G.mode!=='online'||!G.playing)return;
 if(r.status==='finished'){const w=r.winner===G.seat?0:1;return r.coin?coinToss(w):finish(w)}
 const d=Math.max(0,srvMs(r.turn_start));
 if(r.rc>G.rc){G.phase='draw';G.rc=r.rc;setTension();Aud.refresh();showOv(`<div class="t">무승부 — 재대결</div><div>${dbl?'양쪽 동시 사망':MAXT+'턴 초과'}</div><div class="sm">재대결 ${G.rc}/4회차 · 턴마다 ${(0.2*(G.rc+1)).toFixed(1)}초씩 감소<br>상대의 장전·방어는 보이지 않습니다</div>`);later(()=>{$('#ov').style.display='none';resetRound();beginTurn(r)},d)}
 else{G.phase='wait';later(()=>beginTurn(r),d)}}
$('#bOnline').onclick=()=>{$('#olp').style.display='flex';try{const c=localStorage.getItem('duelRoom');if(c){$('#bRejoin').style.display='block';$('#bRejoin').textContent='↩ 방 '+c+' 재접속'}}catch(e){}};
$('#bCreate').onclick=()=>onlineStart('',true);$('#bJoin').onclick=()=>onlineStart($('#rc').value,false);
$('#bRejoin').onclick=()=>{try{onlineStart(localStorage.getItem('duelRoom'),false)}catch(e){}};
 
/* ===== DUEL 래더 자동 매칭 ===== */
let ladderTimer = null;
let ladderBusy = false;

const ladderStatus = document.querySelector('#ladderStatus');
const ladderButton = document.querySelector('#bLadder');

function stopLadderSearch() {
  if (ladderTimer !== null) {
    clearInterval(ladderTimer);
    ladderTimer = null;
  }

  ladderBusy = false;

  if (ladderButton) {
    ladderButton.disabled = false;
    ladderButton.textContent = '🏆 래더 매칭';
  }
}

async function findLadderMatch() {
  if (!sb || !ladderBusy) return;

  try {
    const { data, error } = await sb.rpc('duel_find_match');

    if (!ladderBusy) return;
    if (error) throw error;

    if (data) {
      // 매칭 성공: 반복 검색을 멈추고 기존 온라인 게임에 입장
      stopLadderSearch();
      ladderStatus.textContent = '상대를 찾았습니다! 대결에 입장합니다.';
      enterOnline(data);
    } else {
      ladderStatus.textContent =
        '상대를 찾는 중... 상대가 참가하면 자동으로 연결됩니다.';
    }
  } catch (error) {
    stopLadderSearch();
    ladderStatus.textContent =
      '매칭 오류: ' + (error.message || String(error));
  }
}

async function startLadderSearch() {
  if (ladderBusy) {
    // 매칭 취소
    stopLadderSearch();

    if (sb) {
      const { error } = await sb.rpc('duel_cancel_match');
      if (error) {
        ladderStatus.textContent =
          '취소 처리 오류: ' + error.message;
        return;
      }
    }

    ladderStatus.textContent = '매칭을 취소했습니다.';
    return;
  }

  if (!SB_URL || !SB_KEY || !window.supabase) {
    alert('config.js의 SB_URL과 SB_KEY 설정을 확인해 주세요.');
    return;
  }

  ladderButton.disabled = true;
  ladderButton.textContent = '연결 중...';

  try {
    if (!sb) {
      sb = supabase.createClient(SB_URL, SB_KEY);
    }

    const { data: { session }, error } =
      await sb.auth.getSession();

    if (error) throw error;

    if (!session) {
      const auth = await sb.auth.signInAnonymously();
      if (auth.error) throw auth.error;
    }

    ladderBusy = true;
    ladderButton.disabled = false;
    ladderButton.textContent = '✕ 매칭 취소';
    ladderStatus.textContent = '매칭 서버에 연결했습니다.';

    await findLadderMatch();

    if (ladderBusy && ladderTimer === null) {
      ladderTimer = setInterval(findLadderMatch, 2000);
    }
  } catch (error) {
    stopLadderSearch();
    ladderStatus.textContent =
      '연결 오류: ' + (error.message || String(error));
  }
}

if (ladderButton) {
  ladderButton.addEventListener('click', startLadderSearch);
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&G.mode==='online')syncState()});
